<script>
const D={"groups":[{"title":"Tradisi Buwuhan","head":"Tradisi Buwuhan: Antara Gotong Royong dan Utang Piutang","paras":[{"s":"25BINUTAPTXB01SU-250525-2375 | Bentuk Soal: Pilihan Ganda"},"Tradisi buwuhan merupakan bagian dari budaya masyarakat Jawa, khususnya di kota-kota besar seperti Surabaya. Tradisi ini dilakukan ketika ada acara penting seperti pernikahan atau khitanan yang diadakan di daerah tersebut. Buwuhan merujuk pada kegiatan memberi bantuan, baik berupa barang, uang, maupun tenaga kepada seseorang yang sedang mengadakan hajatan, atau bisa juga disebut sebagai kegiatan menyumbang. Tradisi ini mencerminkan nilai gotong royong dan solidaritas sosial karena keluarga dan tetangga saling bahu-membahu dalam membantu sesama. Namun, praktik buwuhan tidak lepas dari unsur pertukaran atau dipandang sebagai utang. Masyarakat meyakini bahwa segala bentuk bantuan yang diberikan akan kembali dalam bentuk yang setara ketika si pemberi mengadakan hajatan serupa. Hal ini menyebabkan buwuhan tidak lagi dipandang murni sebagai hibah atau sedekah, tetapi sebagai bentuk \"utang tidak tertulis\" yang menimbulkan kewajiban moral untuk membalas.","Dalam praktiknya, buwuhan memang meringankan beban tuan rumah, tetapi dapat menimbulkan tekanan psikologis bagi penerima bantuan. Rasa malu dan kekhawatiran kehilangan harga diri mendorong sebagian orang untuk berutang demi mengembalikan buwuhan. Hal ini menyebabkan terbaginya cara pandang terhadap buwuhan. Ada yang melihatnya sebagai bentuk tolong-menolong, tetapi ada juga yang justru menganggapnya menjadi sistem utang piutang berbasis sosial. Sebagian pihak berpendapat bahwa buwuhan adalah hibah karena tujuannya adalah untuk membantu. Namun, apabila ada keharusan pengembalian, maka secara hukum dan etika, buwuhan telah bergeser dari semangat gotong royong menjadi sebuah kewajiban ekonomi yang membebani. Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.",{"s":"Sumber:"},{"s":"Rachmawati, S. A., & Anwar, M. K. (2021). Budaya dan Tradisi Buwuh sebagai Utang Piutang dalam Adat Pernikahan di Kota Surabaya. Jurnal Ekonomika dan Bisnis Islam, 4(3), hl 69–83."}],"start":1,"end":4},{"title":"Layur, Teruslah berlayar","head":"Layur, Teruslah Berlayar","paras":["“Bapak, pulanglah,” lirih Layur berharap. Ini hari keenam. Tiga hari adalah waktu terlama nelayan berada di laut. Dengan susah payah, Layur berpindah duduk ke dalam sebuah perahu tua. Penyangga kedua kaki Layur yang tak utuh ia letakkan di sampingnya.","\"Jangan-jangan...\"","\"Tidak ... Aku tidak boleh berpikiran buruk. Bapak pasti pulang dengan selamat. Aku akan tetap menunggunya di sini sambil berdoa.\"","Layur masih ingat masa-masa dulu, ketika Bapak berlayar pada malam hari dan keesokan harinya sudah merapat kembali di pantai dengan membawa ikan berlimpah.","“Ayo! Siapa mau udang?” panggil Bapak. Layur berlari kencang bersama teman-temannya. Namun, itu adalah kenangan sepuluh tahun silam. Kini, udang dan ikan kecil adalah anugerah besar. Itu pun harus dijaring di tengah laut.","Layur ingat betul, Bapak adalah pembuat bondet paling disegani, juga berpengaruh di dusun. Setiap hari, nelayan silih berganti datang ke rumah memesan bondet. Hasil panen ikan berlimpah. Tinggal melemparkan bondet ke dalam laut dan ... *bum*! Berkuintal-kuintal ikan terapung tinggal diserok menggunakan jaring.","Sampai suatu ketika ...","*DUAAAR!*","Separuh rumah Layur luluh lantak karena simpanan bondet di gudang meledak. Ledakan bondet di gudang tak hanya merusak rumah tetapi juga mencelakai anak semata wayang. Ia berteriak minta tolong, menepuk-nepuk dadanya, dan menangis. Itulah titik balik yang amat disesali Bapak. Sejak itu, Bapak meninggalkan usaha pembuatan bondet. Demikian pula dengan warga Dusun Prau tempat mereka berdiam berangsur-angsur meninggalkan cara menangkap ikan dengan bondet.","Lamat-lamat terlihat kibaran layar bercorak biru. Layur beringsut menuruni perahu tempatnya duduk. Lambaian tangan bapaknya semakin jelas dan semakin dekat.","“Bapak dari mana? Bapak sudah tiga hari telat pulang!” Seru Layur kesal. Matanya berkaca-kaca, menahan rindu, dan cemas.",{"s":"Karya Anang YB"},{"s":"Daftar Istilah:"},{"s":"Bondet: istilah lokal yang merujuk pada bahan peledak rakitan, sering disebut juga bom ikan."},{"s":"Sumber: https://buku.kemdikbud.go.id/katalog/layur-tetaplah-berlayar (dengan pengubahan)"}],"start":5,"end":8},{"title":"Pantai Bersih Tanpa Sampah","head":"Pantai Bersih Tanpa Sampah","paras":["Di sebuah daerah wisata yang terkenal dengan pantainya yang indah, pemerintah setempat gencar mengampanyekan \"Pantai Bersih Tanpa Sampah.\" Spanduk dan papan peringatan terpampang di berbagai sudut. Namun, kenyataannya seringkali berbeda.","Suatu sore, Pak Wayan, seorang nelayan tua yang sudah puluhan tahun melaut, sedang membersihkan jaringnya di tepi pantai. Di sampingnya, sekelompok turis muda asyik berpose untuk berfoto. Mereka mengenakan topi pantai yang modis, kacamata hitam, dan membawa botol minum berwarna-warni.","\"Wah, pantainya bersih banget ya, *guys*!\" seru salah satu turis sambil memegang ponselnya. \"Pas banget buat konten 'liburan ramah lingkungan'!\"","Temannya menimpali, \"Iya! Nanti *caption*-nya 'Menikmati keindahan alam tanpa jejak, menjaga bumi kita tercinta!'\"","Setelah puas berfoto dari berbagai sudut dengan beragam filter, mereka beranjak pergi. Namun mereka meninggalkan botol minuman plastik kosong, bungkus keripik, dan beberapa puntung rokok yang disembunyikan di balik semak-semak. Mereka bahkan tidak berusaha mencari tempat sampah yang hanya berjarak beberapa meter.","Pak Wayan hanya bisa menggelengkan kepala. Ia berjalan mendekat dan memungut sampah-sampah itu satu per satu. Ia sudah terbiasa dengan pemandangan ini. Para turis datang untuk menikmati keindahan, berfoto, membuat konten, lalu pergi meninggalkan \"kenangan\" dalam bentuk sampah.","Tak lama kemudian, seorang petugas kebersihan berseragam oranye datang dengan sapu dan karung. \"Pak Wayan, sudah banyak lagi ya sampahnya?\" tanyanya sambil menghela napas.","\"Sudah biasa, Nak,\" jawab Pak Wayan. \"Ini namanya 'sampah estetik'. Cuma bagus di foto, tapi busuk di mata dan bau di hidung.\"","Petugas itu tersenyum masam. \"Iya, Pak. Kata mereka peduli lingkungan, tapi pedulinya cuma di *caption* media sosial.\"","Malam harinya, di akun media sosial Pak Wayan—yang diajari cucunya—ia melihat foto-foto pantai yang diunggah para turis tadi. Pantai tampak bersih sempurna, dihiasi filter matahari terbenam yang memukau. Ia membaca *caption*-nya: \"Surgaku, jangan kau kotori!\"","Pak Wayan hanya bisa tersenyum getir. Sepertinya, slogan \"Pantai Bersih Tanpa Sampah\" itu hanya berlaku untuk kamera dan media sosial. Sementara di balik layar, jejak yang ditinggalkan justru lebih nyata dan memprihatinkan daripada gambar yang dipamerkan."],"start":9,"end":11},{"title":"Pulihkan Ekosistem","head":"Pulihkan Ekosistem, Menjaga Planet Kita dari Generasi ke Generasi","paras":["Berdasarkan hasil riset LIPI (Lembaga Ilmu Pengetahuan Indonesia) terjadi peningkatan sampah plastik selama pandemik. Hal ini disebabkan oleh penggunaan layanan *delivery* makanan lewat jasa transportasi *online*, 96% paket dibungkus dengan plastik yang tebal dan ditambah dengan *bubble wrap*. Selain itu selotip, bungkus plastik, dan *bubble wrap* merupakan pembungkus berbahan plastik yang paling sering ditemukan. Sampah medis juga melonjak. Kementerian Lingkungan Hidup dan Kehutanan (KLHK) menyatakan bahwa selama pandemi, terjadi peningkatan timbunan sampah medis sebesar 30% hingga 50%. Dari data tersebut, Indonesia merupakan negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun).","Salah satu faktor penyebab dari pemasalahan tersebut adalah dengan pertambahan jumlah penduduk akan terjadi peningkatan aktivitas manusia dan daya konsumsi yang melonjak. Hal itu menyebabkan meningkatnya jumlah dan jenis limbah sehingga menyebabkan lingkungan menjadi tercemar. Selain sampah, penebangan pohon secara liar sampai pada kebakaran hutan menjadi penyumbang terbesar dalam kerusakan ekosistem. Banyak aktivitas manusia yang mengancam pelestarian lingkungan sehingga menyebabkan ketidakseimbangan ekosistem. Manusia punya peran besar dalam menjaga keseimbangan ekosistem, bukan cuma untuk sekarang, tapi juga untuk generasi mendatang. Tanggung jawab dalam menjaga lingkungan, tentunya bukan hanya dibebankan oleh pemerintah saja, tetapi seluruh elemen masyarakat harus bahu-membahu dalam menjaga dan melestarikan lingkungan.","Bertepatan dengan peringatan Hari Lingkungan Hidup Sedunia, yang tidak hanya sebagai seremonial belaka, tentunya menjadi sebuah harapan dalam meningkatkan kesadaran menjaga dan melestarikan lingkungan. Selain itu, memberikan semangat baru bagi kita semua untuk komitmen menjaga lingkungan. Dengan memulai dari diri sendiri dan hal paling kecil, yaitu tidak membuang sampah sembarangan, terutama sampah plastik karena merusak ekosistem laut, tidak menebang pohon dengan liar hingga membuat gundul hutan. Mari bersama merobohkan jurang ekologis, memulihkan ekosistem bumi dengan pendekatan pengelolaan sumber daya alam yang adil dan berkelanjutan.",{"s":"Sumber: https://uiad.ac.id/2021/06/06/opini-pulihkan-ekosistem-menjaga-planet-kita-dari-generasi-ke-generasi/ (dengan pengubahan)"}],"start":12,"end":14},{"title":"Prospek Ekonomi Global","head":"Prospek Ekonomi Global di Tengah Ketidakpastian","paras":["Jakarta, Senin, 16 Juni 2025 – Perekonomian global terus menghadapi tantangan signifikan di tengah ketidakpastian geopolitik dan tekanan inflasi yang persisten. Analisis terbaru yang dirilis pada (Senin, 2/6/2025), oleh Dana Moneter Internasional (IMF) menunjukkan adanya divergensi dalam laju pemulihan ekonomi antarwilayah, di mana beberapa negara seperti Amerika Serikat dan India menunjukkan ketahanan yang lebih baik, sementara negara-negara di Eropa dan Tiongkok masih berjuang mengatasi dampak guncangan eksternal.","Kenaikan harga energi dan pangan tetap menjadi pendorong utama inflasi di banyak negara, dipicu oleh gangguan rantai pasok global dan konflik di Ukraina, memaksa bank sentral untuk mempertahankan kebijakan moneter yang ketat. Upaya ini, meskipun esensial untuk mengendalikan kenaikan harga, berpotensi mengerem pertumbuhan ekonomi. Para pengambil kebijakan dihadapkan pada dilema sulit: menyeimbangkan kebutuhan untuk meredam inflasi tanpa memicu resesi yang dalam.","\"Kami melihat adanya perlambatan pertumbuhan global yang signifikan di tahun ini, dan risiko resesi menjadi lebih nyata jika bank sentral terlalu agresif dalam menaikkan suku bunga,\" ujar seorang ekonom senior dari Bank Dunia, dalam sebuah webinar yang diadakan, (Rabu, 11/6).","Di sisi lain, sektor manufaktur global menunjukkan tanda-tanda perlambatan, tercermin dari menurunnya indeks manajer pembelian (PMI) di beberapa ekonomi besar seperti Jerman dan Jepang. Penurunan permintaan ekspor dan gangguan rantai pasok masih menjadi perhatian utama bagi produsen. Namun, sektor jasa justru menunjukkan resiliensi yang lebih kuat, didukung oleh kembali normalnya aktivitas setelah pandemi, sebuah tren yang mulai terlihat sejak awal Desember 2024.","Pasar tenaga kerja di beberapa negara maju masih relatif ketat, dengan tingkat pengangguran yang rendah. Kondisi ini memberikan dukungan terhadap daya beli konsumen, meskipun tekanan biaya hidup yang tinggi dapat mengikis dampaknya. Sementara itu, investasi langsung asing (FDI) cenderung melambat, mencerminkan kehati-hatian investor di tengah prospek ekonomi yang tidak menentu.","Ke depan, koordinasi kebijakan ekonomi antarnegara akan menjadi kunci untuk menstabilkan kondisi global. Reformasi struktural yang bertujuan meningkatkan produktivitas dan daya saing juga dianggap krusial untuk memastikan pertumbuhan yang berkelanjutan dalam jangka panjang. Para ekonom memprediksi bahwa prospek ekonomi akan sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan perkembangan situasi geopolitik di seluruh dunia. Bagi Indonesia, kondisi ini menuntut kewaspadaan dan diversifikasi ekonomi agar tidak terlalu rentan terhadap gejolak global dalam kurun waktu tiga hingga enam bulan ke depan, terhitung sejak (16/6/2025).",{"s":"Sumber: Disadur dan diadaptasi dari rilis pers dan laporan Global Economic Prospects, Juni 2025 oleh World Bank (Bank Dunia)."}],"start":15,"end":17},{"title":"Tari Hudoq","head":"Tari Hudoq: Warisan Budaya yang Harus Dilestarikan","paras":["Tari Hudoq dari suku Dayak Modang di Kalimantan Timur bukan sekadar tontonan seni biasa. Lebih dari itu, tarian ini adalah warisan budaya yang sarat akan makna spiritual dan simbolis. Oleh karena itu, melestarikan Tari Hudoq menjadi sebuah keharusan, tidak hanya untuk menjaga keragaman budaya Indonesia, tetapi juga untuk mengingatkan kita akan pentingnya hubungan harmonis antara manusia dan alam.","Pertama, Tari Hudoq adalah cerminan dari kearifan lokal yang mengajarkan nilai-nilai fundamental. Tarian ini merupakan bagian integral dari ritual keagamaan untuk menjalin hubungan harmonis dengan roh penjaga pertanian, *Halaeng Heboung*, dan roh pelindung umat manusia, *Selo Sen*. Dalam era modern yang sering kali mengabaikan hubungan manusia dengan alam, tarian ini berfungsi sebagai pengingat kuat akan ketergantungan kita pada alam dan pentingnya menghormati kekuatan yang lebih besar dari diri kita.","Kedua, setiap elemen Tari Hudoq mengandung simbolisme yang mendalam dan relevan. Penggunaan topeng kayu yang besar dan dedaunan yang menutupi tubuh penari bukan sekadar properti, melainkan representasi kekuatan dan perlindungan dari roh-roh tersebut. Gerakan tari yang menggambarkan keteguhan petani serta nyanyian tradisional yang mengiringinya adalah permohonan tulus kepada alam semesta untuk memberikan keseimbangan dan kesuksesan panen. Menghilangkan tarian ini berarti menghilangkan simbolisme penting yang telah diwariskan turun-temurun, yang merupakan esensi dari budaya Dayak Modang itu sendiri.","Ketiga, Tari Hudoq memiliki nilai edukatif yang tinggi bagi masyarakat luas, termasuk wisatawan. Pertunjukan ini tidak hanya memukau secara visual, tetapi juga memberikan pemahaman tentang pentingnya keseimbangan alam dan hubungan spiritual yang mendalam. Dengan melestarikan dan memperkenalkan tarian ini kepada publik yang lebih luas, kita tidak hanya menjaga keberadaan tarian itu sendiri, tetapi juga menyebarkan pesan tentang pentingnya menjaga lingkungan dan menghargai nilai-nilai tradisional.","Dengan demikian, jelaslah bahwa Tari Hudoq bukan sekadar pertunjukan, melainkan sebuah jembatan spiritual yang menghubungkan manusia dengan alam dan leluhur. Mengabaikan pelestariannya sama saja dengan mengabaikan kekayaan spiritual dan kearifan lokal yang menjadi fondasi budaya kita. Pelestarian Tari Hudoq adalah investasi untuk masa depan, memastikan bahwa nilai-nilai berharga ini tetap hidup dan relevan bagi generasi mendatang.",{"s":"Sumber:"},{"s":"https://kebudayaan.kemdikbud.go.id/ditwdb/hudoq/ (dengan penyesuaian)"},{"s":"https://pustakaborneo.id/artikel/hudoq-tradisi-tari-sakral-suku-dayak-di-kalimantan (dengan penyesuaian)"},{"s":"https://1001indonesia.net/hudoq-tarian-sakral-dari-suku-dayak/ (dengan penyesuaian)"},{"s":"https://www.timesnusantara.com/2024/12/08/tari-hudoq-tarian-spiritual-yang-menghubungkan-manusia-dengan-alam/ (dengan penyesuaian)"}],"start":18,"end":21},{"title":"Interaksi Sosial","head":"Interaksi Sosial di Era Digital","paras":[{"s":"25BINUTAPTXB01SU-250527-2409 | Bentuk Soal: Pilihan Ganda"},"Penggunaan telepon genggam menjadi kebutuhan pokok di era digital. Mayoritas masyarakat saat ini sudah menggunakan telepon genggam. Kemudahan akses informasi dan komunikasi yang diperoleh dari penggunaan telepon genggam memberikan manfaat sekaligus dampak yang masif terhadap interaksi sosial di tengah masyarakat.","Berdasarkan data Badan Pusat Statistik (BPS), proporsi Individu yang memiliki telepon genggam menurut kelompok umur didominasi oleh orang-orang dengan rentang usia 15-24. Artinya, masyarakat kelahiran tahun 2000 termasuk individu yang mendominasi pemilik dan pengguna telepon genggam. Individu pada rentang usia tersebut tergolong dalam generasi Z (gen-Z) yang lahir dan tumbuh pada era internet dan telepon genggam.","Perubahan cara komunikasi dari tatap muka ke virtual seiring dengan berkembangnya telepon genggam menjadi ponsel pintar mengubah pola interaksi sosial. Dibanding ruang fisik, gen-z lebih menyukai interksi pada ruang virtual. Hal itu mengurangi kualitas interaksi sosial secara langsung. Dalam satu ruang yang sama, mereka bisa lebih fokus pada interaksi virtual melalui ponsel pintar daripada berkomunikasi langsung dengan orang-orang di sekitarnya. Perubahan pola interaksi sosial tersebut merupakan tantangan di era perkembangan teknologi.","Berdasarkan hasil observasi yang dilakukan tahun 2020, sebagian besar informan menyatakan bahwa terdapat faktor eksternal dan internal yang menjadi pemicu terjadinya pergeseran pola interaksi dalam masyarakat. *Pertama,* faktor ekternal dari alat- alat canggih seperti ponsel pintar yang mampu menghubungkan komunikasi tanpa melalui tatap muka. *Kedua,* faktor internal berupa ketergantungan ponsel pintar dan perilaku *phubbing*.","Pergeseran pola interaksi sosial membuat nilai-nilai budaya seperti tenggang rasa, sopan santun, empati, dan kepedulian sosial menurun. Ungkapan “medekatkan yang jauh dan menjauhkan yang dekat” pada era digital merupakan suatu realitas yang dapat menjadi bahan refleksi untuk semua orang.","Adanya pergeseran pola interaksi sosial secara khusus menuntut orang tua memberikan pemahaman yang lebih pada anaknya agar tetap mempertahankan nilai budaya. Ponsel pintar terus berkembang setiap tahun dengan fitur-fitur yang menawarkan kepraktisan tanpa disadari akan mengontrol penggunaanya untuk mengabaikan interaksi sosial secara langsung. Oleh karena itu, perlu kesadaran bersama untuk memanfaatkan ponsel pintar secara bijak tanpa mengabaikan interaksi sosial dalam ruang fisik. Upaya tersebut merupakan langkah nyata untuk melestarikan nilai-nilai budaya dan menjaga hubungan sosial.",{"s":"Referensi: Artikel ilmiah “Pergeseran Pola Interaksi Sosial” oleh Iva St Syahrah, dkk dan data BPS dari artikel Gen Z Mendominasi Pengguna Handphone Indonesia dalam https://data.goodstats.id/"}],"start":22,"end":25},{"title":"Roh Meratus","head":"Roh Meratus","paras":[{"s":"25BINUTAPTXB02SU-250472-2321 | Bentuk Soal: Pilihan Ganda"},"Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah.","Aku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon!","“Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan...” tetua menghentikan langkahnya dan mengambil sesuatu dalam *butah*. “Roh Meratus meniupkan *wisa* ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat,” sambungnya kemudian melemparkan gulungan kertas yang diambil dari *butah*. Sigap kutangkap gulungan itu.","“Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu,” katanya dingin.","Perlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini...akan bagaimana?","“Tetua, izinkan aku tinggal di sini dan bersama kaumu menjaga tempat ini...” Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap.",{"s":"(Cerpen karya Zaidinoor)"},{"s":"Glosarium"},{"s":"Butah: wadah atau tempat yang digunakan untuk membawa sesuatu, biasanya terbuat dari anyaman rotan atau bambu"},{"s":"Wisa: bisa atau racun"}],"start":26,"end":29},{"title":"Tradisi Belis","head":"Tradisi Belis: Simbol Budaya yang Menyimpan Beban Finansial di Era Modern","paras":[{"s":"25BINUTAPTXB01SU-250531-2525 | Bentuk Soal: Pilihan Ganda"},"Belis adalah tradisi di wilayah Indonesia bagian timur seperti Nusa Tenggara Timur, yang secara umum di Indonesia dikenal dengan mas kawin atau mahar. Tradisi ini melambangkan penghormatan kepada wanita dan penyatuan keluarga. Namun, di balik nilainya, belis sering menjadi beban finansial berat bagi pihak laki-laki, yang kadang memicu tekanan psikologis dan mengganggu hubungan kekeluargaan. Beberapa pihak, terutama para sesepuh desa atau orang-orang tua, kadang terlalu kukuh untuk mempertahankan tradisi dan membuat tekanan dengan nilai yang semakin naik.","Belis memiliki makna yang mendalam dan dianggap sebagai bentuk pengakuan atas peran penting seorang perempuan di dalam keluarga. Belis merupakan representasi keseriusan dan komitmen seorang pria untuk membangun keluarga. Proses penyerahan belis tidak hanya dimaknai sebagai pertukaran materi, tetapi juga sebagai simbol penyatuan dua komunitas besar, yakni keluarga kedua belah pihak. Pada masyarakat Lamaholot misalnya, belis diwujudkan dalam bentuk gading gajah atau bala, yang besarnya disesuaikan dengan status sosial seorang perempuan. Selain itu, disertakan juga pelengkap belis seperti sarung tenun sutra dan ternak. Uniknya, meskipun belis dari pihak laki-laki, pihak keluarga perempuan memberikan balasan simbolis kepada pihak laki-laki dalam bentuk barang berharga lainnya. Tradisi ini mengajarkan keseimbangan dan saling menghargai di antara kedua belah pihak.","Meskipun belis mengandung nilai-nilai yang positif, tantangannya saat ini adalah menjaga agar tradisi tersebut tidak menjadi beban finansial yang berat. Tuntutan belis yang tinggi sering kali menjadi sumber tekanan, terutama bagi keluarga laki-laki. Dalam beberapa kasus, perkara belis dapat berimbas pada kesehatan mental hingga memicu tindakan tragis, seperti yang pernah terjadi di Kupang. Selain menjadi tantangan finansial, besarnya tuntutan materi untuk belis juga sering kali menimbulkan ketegangan dan konflik di antara pasangan dan keluarganya. Ketika keluarga perempuan menetapkan nominal belis yang tinggi, tidak jarang hal ini membangkitkan sentimen negatif dari pihak laki-laki yang merasa tertekan dan kehilangan martabat jika tidak mampu memenuhinya. Alhasil, penundaan pernikahan diambil guna memenuhi permintaan belis. Konflik semacam ini bisa merusak hubungan dua keluarga yang harusnya harmonis.",{"s":"Sumber:"},{"s":"https://beritakini.co.id/detail/36671/tradisi-belis-simbol-budaya-yang-menyimpan-beban-finansial-di-era-modern"},{"s":"https://www.krajan.id/belis-dalam-pernikahan-adat-ntt-simbol-budaya-atau-beban-sosial/#google_vignette"}],"start":30,"end":33}],"qs":[{"n":1,"g":0,"type":"pg","question":"Apa makna kata *hajatan* pada teks tersebut?","opts":["Kegiatan kerja bakti membersihkan lingkungan sekitar.","Pertemuan rutin warga untuk membahas masalah lingkungan.","Diskusi keluarga besar untuk menentukan pembagian warisan.","Permohonan bantuan yang dilakukan tuan rumah kepada tetangga.","Acara atau pesta yang diadakan untuk memperingati hal penting."],"key":"E","alt":null,"exp":"*Hajatan* berarti acara atau pesta yang diadakan untuk memperingati hal penting. Teks menyebut pernikahan atau khitanan sebagai contoh hajatan. Pilihan lain bukan kegiatan perayaan.","kom":"Pemahaman Tekstual"},{"n":2,"g":0,"type":"pg","question":"Manakah gagasan yang mendukung ide pokok bahwa buwuhan adalah bentuk utang?","opts":["Praktik buwuhan disertai dengan perjanjian utang piutang secara tertulis.","Buwuhan disertai kesepakatan untuk selalu memberi lebih dari yang diterima.","Bentuk buwuhan dapat berupa sedekah atau hibah yang harus dibayar kembali.","Buwuhan dilakukan oleh tetangga dan kerabat sebagai bentuk pertukaran solidaritas.","Penerima buwuhan merasa harus mengembalikan bantuan yang diterima di kemudian hari."],"key":"E","alt":null,"exp":"Ide pokoknya: buwuhan dipandang sebagai utang. Gagasan pendukung yang paling langsung adalah penerima merasa wajib mengembalikan bantuan di kemudian hari, sesuai kalimat “bantuan akan kembali dalam bentuk yang setara”.","kom":"Pemahaman Inferensial"},{"n":3,"g":0,"type":"pg","question":"Hubungan makna paragraf kedua dan ketiga adalah ....","opts":["perbedaan jenis buwuhan berdasarkan jenis acara yang dilangsungkan","penjelasan sebab dan akibat dari perbedaan pandangan mengenai buwuhan","penjelasan dampak buruk dari adanya pandangan buwuhan sebagai sedekah","perbedaan tata cara buwuhan pada beberapa kelurahan atau desa di Surabaya","penjelasan hubungan hukum agama dengan pengertian masyarakat terhadap buwuhan"],"key":"B","alt":null,"exp":"Paragraf kedua memaparkan buwuhan dipandang sebagai utang. Paragraf ketiga menjelaskan akibatnya: tekanan psikologis dan terbaginya cara pandang (tolong-menolong atau utang piutang). Jadi hubungannya sebab-akibat dari perbedaan pandangan.","kom":"Pemahaman Inferensial"},{"n":4,"g":0,"type":"pg","question":"“Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.” Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ....","opts":["merangkum sebab-akibat dari adanya tradisi buwuhan di wilayah Surabaya","menyimpulkan ketidaksetujuan masyarakat terhadap penghapusan tradisi buwuhan","menyangkal pandangan negatif yang ada di masyarakat untuk pelestarian buwuhan","menyimpulkan berbagai pandangan masyarakat terhadap konsep buwuhan","menggarisbawahi solusi untuk melestarikan tradisi buwuhan di seluruh wilayah Jawa"],"key":"D","alt":null,"exp":"Kalimat itu menutup teks setelah dipaparkan pandangan yang berbeda (hibah vs utang). Kalimat tersebut menyimpulkan perlunya meluruskan pemahaman terhadap berbagai pandangan masyarakat tentang konsep buwuhan.","kom":"Evaluasi dan Apresiasi"},{"n":5,"g":1,"type":"pg","question":"Berdasarkan teks tersebut, bagaimana sifat yang dimiliki oleh Layur?","opts":["Nekat dan optimis","Mudah cemas dan tabah","Penuh harap dan kasih sayang","Suka menyendiri dan tegas","Cepat panik dan menyalahkan keadaan"],"key":"C","alt":null,"exp":"Layur berharap (“Bapak, pulanglah”), menahan rindu, menolak berpikiran buruk, dan menunggu sambil berdoa. Semua itu menunjukkan sifat penuh harap dan kasih sayang kepada bapaknya.","kom":"Pemahaman Tekstual"},{"n":6,"g":1,"type":"pg","question":"Apa yang menyebabkan Layur kesal kepada Bapak?","opts":["Tidak pamit kepada Layur saat hendak berlayar","Tidak membawa banyak ikan dari laut","Tidak setuju Layur menunggu terlalu lama di pantai","Tidak kunjung pulang setelah enam hari melaut","Tidak menepati janjinya untuk pulang tepat waktu ketika melaut"],"key":"D","alt":null,"exp":"Layur kesal karena bapaknya tidak kunjung pulang. Waktu terlama melaut adalah tiga hari, sedangkan ini sudah hari keenam, atau terlambat tiga hari. Pilihan E menyebut “janji” yang tidak ada dalam teks.","kom":"Pemahaman Inferensial"},{"n":7,"g":1,"type":"pg","question":"Bagaimana kisah yang sesuai untuk menutup cerita Layur merasa lega pada cerita tersebut?","opts":["Bapak meminta maaf pada Layur dan menceritakan penyebabnya pulang terlambat","Bapak membimbing Layur pulang dan berjanji untuk tidak pulang terlambat lagi","Bapak memeluk Layur dan merasa senang karena akhirnya ia bisa bertemu putrinya kembali","Layur membereskan sampan dan memberikan hasil tangkapan yang tidak seberapa kepada Bapak","Layur berterima kasih kepada Bapak karena telah menunggunya pulang dari melaut berhari-hari"],"key":"A","alt":null,"exp":"Layur kesal dan cemas, sehingga akhir yang membuatnya lega adalah Bapak meminta maaf dan menjelaskan penyebab keterlambatannya. Pilihan C berpusat pada perasaan Bapak, bukan kelegaan Layur.","kom":"Pemahaman Inferensial"},{"n":8,"g":1,"type":"pg","question":"Bagaimana reaksi yang ditunjukkan oleh Bapak ketika rumahnya luluh lantak dan bondet buatannya melukai Layur?","opts":["Merasa trauma dan membutuhkan waktu untuk menyendiri","Menunjukkan respons yang biasa seperti tidak terjadi apa-apa","Sangat terkejut dan sungguh menyesal atas apa yang dilakukan","Marah terhadap orang lain dan merasa panik yang luar biasa","Bingung dan berusaha mencerna terhadap apa yang telah terjadi"],"key":"C","alt":null,"exp":"Ledakan bondet merusak rumah dan melukai anaknya. Teks menyebut itu “titik balik yang amat disesali Bapak” hingga ia meninggalkan usaha bondet, jadi ia terkejut dan sangat menyesal.","kom":"Evaluasi dan Apresiasi"},{"n":9,"g":2,"type":"pg","question":"Manakah urutan peristiwa berikut yang paling sesuai dengan isi teks?","opts":["Pak Wayan melihat foto turis di media social → petugas kebersihan datang → turis membuat konten","Turis berfoto dan membuat konten → Pak Wayan memungut sampah → petugas kebersihan datang","Pemerintah mengampanyekan kebersihan → Pak Wayan melihat foto turis → petugas kebersihan datang","Petugas kebersihan datang → turis membuat konten di media soal → Pak Wayan memungut sampah","Pak Wayan memungut sampah → turis membuat konten → pemerintah mengampanyekan kebersihan"],"key":"B","alt":null,"exp":"Urutan di teks: turis berfoto dan membuat konten, lalu pergi meninggalkan sampah. Pak Wayan memungut sampah, lalu petugas kebersihan datang. Pak Wayan melihat foto di media sosial pada malam hari, sesudahnya.","kom":"Pemahaman Tekstual"},{"n":10,"g":2,"type":"pg","question":"Apa pesan moral yang disiratkan melalui dialog antara Pak Wayan dan petugas kebersihan?","opts":["Menjaga kebersihan pantai adalah tanggung jawab utama pemerintah dan petugas kebersihan","Wisatawan seringkali menikmati keindahan alam tanpa memiliki kepedulian yang mendalam","Kesadaran lingkungan sejati harus dibuktikan lewat tindakan, bukan hanya kata-kata di media sosial","Media sosial bisa menjadi sarana positif untuk mengampanyekan kepedulian terhadap lingkungan","Nelayan dan petugas kebersihan sering kali menjadi pihak yang terdampak langsung oleh sampah"],"key":"C","alt":null,"exp":"Dialog Pak Wayan dan petugas menyindir turis yang “peduli lingkungan” hanya di *caption*. Pesan moralnya: kesadaran lingkungan harus dibuktikan dengan tindakan, bukan sekadar kata-kata di media sosial.","kom":"Pemahaman Inferensial"},{"n":11,"g":2,"type":"pg","question":"Manakah relevansi paling kuat antara sindiran dalam teks dengan realitas kehidupan sehari-hari, terutama terkait kesadaran lingkungan dan pencitraan?","opts":["Kritik terhadap kampanye \"Pantai Bersih\" yang hanya menjadi slogan, menunjukkan kurangnya efektivitas program pemerintah","Sindiran bagi pembuat konten \"liburan ramah lingkungan\" hanya untuk pencitraan semata karena tetap membuang sampah sembarangan","Penggambaran turis yang kewalahan dan menghela napas mencerminkan beban kerja yang berat karena perilaku abai para pengunjung","Keadaan Pak Wayan yang terbiasa dengan pemandangan sampah di pantai menunjukkan adanya budaya pasrah terhadap masalah lingkungan","Kontras antara spanduk \"Bersih Tanpa Sampah\" dengan sampah kenangan yang ditinggalkan, menunjukkan perlunya pengawasan ketat"],"key":"B","alt":null,"exp":"Turis membuat konten “liburan ramah lingkungan” tetapi membuang sampah sembarangan. Ini relevan dengan kehidupan nyata, yaitu pencitraan semata tanpa kepedulian sungguh-sungguh.","kom":"Evaluasi dan Apresiasi"},{"n":12,"g":3,"type":"pg","question":"Bagaimana hubungan makna antara paragraf 1 dan paragraf 2 dalam teks tersebut?","opts":["Paragraf 2 menjelaskan akibat dari fenomena sampah yang diuraikan di paragraf 1","Paragraf 2 menyajikan solusi awal untuk permasalahan yang diperkenalkan di paragraf 1","Paragraf 2 memberikan contoh spesifik dari jenis sampah yang disebutkan di paragraf 1","Paragraf 2 mengkritisi data yang rancu tentang sampah yang disajikan di paragraf 1","Paragraf 2 menguraikan penyebab dari permasalahan yang dijabarkan di paragraf 1"],"key":"E","alt":null,"exp":"Paragraf 1 memaparkan masalah (peningkatan sampah plastik dan medis). Paragraf 2 dibuka dengan “Salah satu faktor penyebab dari permasalahan tersebut…”, jadi menguraikan penyebabnya.","kom":"Pemahaman Inferensial"},{"n":13,"g":3,"type":"bs","intro":["Aktivitas manusia memberikan dampak besar terhadap pencemaran lingkungan di Indonesia.","Data apa saja yang mendukung opini penulis tersebut?","Klik pilihan Benar atau Salah untuk setiap pernyataan sesuai isi teks!"],"rows":["Peningkatan aktivitas manusia yang menyebabkan lingkungan tercemar didukung oleh data lonjakan timbunan sampah medis sebesar 30-50%","Tingginya jumlah dan jenis limbah didukung oleh data bahwa 96% paket dibungkus dengan plastik tebal dan *bubble wrap*","Kebakaran hutan yang merusak ekosistem didukung data bahwa Indonesia merupakan negara ke-2 penyumbang sampah"],"key":["B","B","S"],"alt":null,"exp":"Pernyataan 1 Benar: data sampah medis naik 30–50% mendukung opini bahwa aktivitas manusia menambah pencemaran. Pernyataan 2 Benar: 96% paket berplastik tebal dan *bubble wrap* mendukung tingginya jumlah dan jenis limbah. Pernyataan 3 Salah: data Indonesia sebagai penyumbang sampah laut ke-2 tidak berkaitan dengan kebakaran hutan.","kom":"Evaluasi dan Apresiasi"},{"n":14,"g":3,"type":"pg","question":"Mengapa penulis memilih istilah 'bahu-membahu' untuk menggambarkan peran semua pihak dalam upaya pelestarian lingkungan?","opts":["Memperkuat makna pentingnya kolaborasi berbagai pihak untuk mencapai tujuan","Memberikan sedikit kesan informal yang mungkin kurang pas untuk teks opini","Mengindikasikan bahwa idiom lebih cocok digunakan untuk konteks fisik","Menyiratkan adanya paksaan atau tekanan dari satu pihak kepada pihak lain","Menunjukkan bahwa konteks ini terlalu ambigu dan tidak ada definisi yang jelas"],"key":"A","alt":null,"exp":"*Bahu-membahu* adalah idiom yang bermakna bekerja sama. Pemilihannya memperkuat pesan bahwa seluruh elemen masyarakat harus berkolaborasi menjaga lingkungan.","kom":"Evaluasi dan Apresiasi"},{"n":15,"g":4,"type":"pg","question":"Fenomena yang menggambarkan \"*inflasi*\" berdasarkan teks di atas adalah ...","opts":["Pengencangan anggaran negara karena kurangnya barang dan jasa","Kenaikan harga barang dan jasa secara terus menerus dalam kurun waktu tertentu","Biaya yang mendorong kemandirian ekonomi hingga mampu bersaing secara global","Pergeseran tren pasar global terhadap produk-produk dari Indonesia","Lambatnya sektor manufaktur global akibat menurunnya pembelian"],"key":"B","alt":null,"exp":"Inflasi adalah kenaikan harga barang dan jasa secara terus-menerus dalam kurun waktu tertentu. Teks menyebutnya sebagai akibat kenaikan harga energi dan pangan.","kom":"Pemahaman Tekstual"},{"n":16,"g":4,"type":"pg","question":"Peristiwa yang menggambarkan tantangan perekonomian global adalah ...","opts":["Bank sentral di seluruh dunia mengesampingkan kebijakan moneter demi pertumbuhan ekonomi global","Geopolitik berperan penting dalam menjaga kestabilan dan kekuatan perekonomian pada skala global","Pertumbuhan ekonomi melambat sehingga memicu terjadinya resesi yang dialami masyarakat secara global","Harga energi, pangan, dan komoditas lainnya yang tidak menentu terus menekan daya beli masyarakat","Geopolitik memperlancar jalur perdagangan dan produksi sehingga menciptakan inflasi besar-besaran"],"key":"D","alt":null,"exp":"Tantangan yang dibahas teks adalah inflasi akibat kenaikan harga energi dan pangan serta ketidakpastian ekonomi yang menekan daya beli. Pilihan C keliru karena resesi baru berupa risiko, belum terjadi.","kom":"Pemahaman Inferensial"},{"n":17,"g":4,"type":"pg","question":"Manakah pernyataan yang dapat menjadi kelanjutan teks tersebut?","opts":["Peran aktif IMF dan Bank Dunia dalam menanggulangi krisis ekonomi dan pembentukan SDM di negara berkembang secara global","Dampak langsung kebijakan suku bunga bank sentral terhadap tingkat pengangguran di setiap negara dan menjadi masalah global","Analisis mendalam mengenai skenario dan kemungkinan-kemungkinan terkait evolusi inflasi, respons kebijakan, serta situasi geopolitik","Analisis mengenai skenario dan kemungkinan-kemungkinan terkait evolusi inflasi, respons kebijakan, serta situasi geopolitik global","Pentingnya investasi di sektor manufaktur untuk meningkatkan ekspor dan mengurangi gangguan rantai pasok secara global"],"key":"C","alt":["C","D"],"exp":"Bagian akhir teks menyebut prospek ekonomi bergantung pada evolusi inflasi, respons kebijakan moneter, dan situasi geopolitik. Kelanjutan yang logis adalah analisis skenario mengenai ketiga hal tersebut. Pilihan C dan D hampir identik (lihat catatan di akhir).","kom":"Pemahaman Inferensial"},{"n":18,"g":5,"type":"pg","question":"Makna dari istilah *Halaeng Heboung* dan *Selo Sen* dalam teks tersebut adalah ....","opts":["Jenis topeng yang digunakan dalam tari Hudoq untuk menciptakan kesan mistis","Nama-nama suku asli Dayak Modang yang menjadi leluhur pencipta tari Hudoq","Judul nyanyian tradisional yang mengiringi tiap gerakan dalam tari Hudoq","Sebutan khusus untuk roh penjaga pertanian dan roh pelindung umat manusia","Simbol kesuburan tanah dan kesejahteraan hidup masyarakat Dayak Modang"],"key":"D","alt":null,"exp":"Teks menjelaskan *Halaeng Heboung* sebagai roh penjaga pertanian dan *Selo Sen* sebagai roh pelindung umat manusia, jadi keduanya adalah sebutan untuk roh.","kom":"Pemahaman Tekstual"},{"n":19,"g":5,"type":"pg","question":"Tari Hudoq tidak hanya warisan budaya, tetapi juga bentuk pengajaran nilai-nilai spiritual dan ekologis yang berasal dari kearifan lokal. Pernyataan mana yang mendukung ide tersebut?","opts":["Tari Hudoq menyajikan tontonan yang memukau pengunjung yang berlibur ke Kalimantan","Tari Hudoq menggunakan topeng kayu besar dan daun-daunan sebagai ciri khas penampilan","Tari Hudoq menggambarkan semangat petani suku Dayak dalam menjaga hasil panen","Tari Hudoq termasuk warisan budaya Indonesia yang mengajarkan nilai keberlanjutan","Tari Hudoq menjadi pengingat kuat akan ketergantungan manusia pada alam"],"key":"E","alt":null,"exp":"Ide yang didukung: tari Hudoq mengajarkan nilai spiritual dan ekologis. Pernyataan yang paling mendukung adalah tari ini menjadi pengingat ketergantungan manusia pada alam (nilai ekologis).","kom":"Pemahaman Inferensial"},{"n":20,"g":5,"type":"pg","question":"Bagaimana keterkaitan antara paragraf ketiga dengan paragraf keempat pada teks tersebut?","opts":["Paragraf ketiga dan keempat saling melengkapi argumen tentang pentingnya pelestarian Tari Hudoq","Paragraf ketiga dan keempat sama-sama menjelaskan tentang ritual pertanian dengan penekanan pada sejarah","Paragraf ketiga menguraikan makna filosofis Tari Hudoq yang sudah disinggung pada paragraf keempat","Paragraf ketiga adalah opini penulis tentang tari Hudoq yang didukung oleh data penjelas pada paragraf keempat","Paragraf ketiga menjabarkan tantangan budaya tentang tari Hudoq dan paragraf keempat berisi penyelesaiannya"],"key":"A","alt":null,"exp":"Paragraf ketiga (simbolisme) dan keempat (nilai edukatif) sama-sama memberi alasan Tari Hudoq harus dilestarikan, sehingga saling melengkapi argumen.","kom":"Pemahaman Inferensial"},{"n":21,"g":5,"type":"pg","question":"Mengapa paragraf terakhir pada teks tersebut sudah sesuai untuk menutup isi tes tersebut?","opts":["Berisi fungsi Tari Hudoq sebagai hiburan masyarakat dan dalam harapan dalam perayaan panen","Menekankan peran penting Tari Hudoq dalam menjaga pertanian dan hubungan harmonis antarwarga","Merangkum seluruh poin penting dan memberikan penegasan yang kuat tentang pelestarian tari Hudoq","Menegaskan penjelasan bahwa tari Hudoq mengandung nilai-nilai penting dan hubungannya dengan alam","Mewakili makna gerakan dan properti khas seperti topeng dan daun-daunan yang digunakan dalam pertunjukkan"],"key":"C","alt":null,"exp":"Paragraf terakhir diawali “Dengan demikian…”. Isinya merangkum poin-poin penting (jembatan spiritual, kearifan lokal, investasi masa depan) dan menegaskan pentingnya pelestarian.","kom":"Evaluasi dan Apresiasi"},{"n":22,"g":6,"type":"pg","question":"Apa makna kata *diunduh* dalam teks tersebut?","opts":["diakses dengan internet","diambil dari internet","diakses dari aplikasi","dikontrol dari aplikasi","dibuat dari aplikasi"],"key":"B","alt":null,"exp":"*Diunduh* berarti diambil dari internet (*download*). Kata ini tidak muncul pada teks yang tercetak (lihat catatan).","kom":"Pemahaman Tekstual"},{"n":23,"g":6,"type":"pg","question":"Manakah gagasan yang mendukung bahwa ponsel pintar menimbulkan pergeseran pola komunikasi?","opts":["Berkembangnya ponsel pintar mengubah interaksi sosial","Gen-Z cenderung menyukai interaksi dalam ruang fisik","Ponsel pintar membuat gen-Z berfokus pada ruang fisik","Interaksi virtual membuat interaksi langsung berkurang","Perubahan interaksi sosial adalah tantangan gen-Z"],"key":"D","alt":null,"exp":"Pergeseran pola komunikasi didukung oleh gagasan bahwa interaksi virtual membuat interaksi langsung berkurang, sesuai paragraf ketiga. Pilihan lain menyatakan hal yang bertentangan dengan teks atau terlalu umum.","kom":"Pemahaman Inferensial"},{"n":24,"g":6,"type":"pg","question":"Hubungan makna antara paragraf tiga dan paragraf empat adalah ...","opts":["Paragraf tiga merupakan akibat dari faktor-faktor pada paragraf empat","Paragraf tiga merupakan sebab dari faktor-faktor pada paragraf empat","Paragraf empat memperkuat persoalan yang dipaparkan pada paragraf tiga","Paragraf empat merupakan rincian dari persoalan pada paragraf tiga","Paragraf empat memperjelas gagasan yang ditunjukkan pada paragraf tiga"],"key":"A","alt":null,"exp":"Paragraf tiga memaparkan perubahan pola interaksi sosial (akibat). Paragraf empat menjelaskan faktor eksternal dan internal pemicunya (sebab). Jadi paragraf tiga adalah akibat dari faktor-faktor di paragraf empat.","kom":"Pemahaman Inferensial"},{"n":25,"g":6,"type":"pg","question":"“Penggunaan ponsel pintar yang tidak bijak berdampak pada penurunan interaksi sosial dan nilai-nilai budaya.” Kalimat tersebut dapat menjadi kesimpulan yang sesuai dari teks tersebut karena ....","opts":["mewakili isi teks tentang dampak penggunaan ponsel pintar serta menegaskan agar bijak menggunakannya","menegaskan pernyataan dalam teks tentang dampak penggunaan ponsel pintar bagi penggunannya yang bijak","mewakili keseluruhan isi teks tentang perubahan nilai-nilai budaya akibat frekuensi penggunaan ponsel pintar","menegaskan pernyataan dalam teks bahwa memanfaatkan ponsel pintar secara bijak adalah tanggung jawab individu","mewakili keseluruhan isi teks tentang faktor yang berpengaruh terhadap penurunan interaksi sosial dan nilai budaya"],"key":"A","alt":null,"exp":"Kalimat itu menyimpulkan dampak penggunaan ponsel pintar yang tidak bijak sekaligus menegaskan perlunya menggunakannya dengan bijak, sesuai isi teks dan paragraf penutup.","kom":"Evaluasi dan Apresiasi"},{"n":26,"g":7,"type":"pg","question":"Latar tempat yang tergambar dalam cerita tersebut adalah ....","opts":["sebuah perkampungan penduduk adat","daerah perkotaan yang ramai","pegunungan batu yang tandus","hutan belantara yang lebat","pantai dengan pasir putih"],"key":"D","alt":null,"exp":"Teks menyebut pohon besar berlumut, sulur bergantungan, semak rimbun, dan sinar matahari hampir tak tembus. Latarnya hutan belantara yang lebat.","kom":"Pemahaman Tekstual"},{"n":27,"g":7,"type":"pg","question":"Apa yang menyebabkan konflik dalam kutipan cerpen tersebut?","opts":["Tokoh utama dan kawan-kawan tersesat di tengah hutan belantara","Kawan-kawan tokoh utama mengalami hal buruk karena *wisa* yang ditiupkan","Tetua menemukan peta dari ransel tokoh utama","Ketua adat tidak menyukai kehadiran orang luar di wilayahnya","Kelompok tokoh utama dianggap mengancam kelestarian hutan"],"key":"E","alt":null,"exp":"Konflik muncul karena kelompok tokoh utama memasang patok dan menandai pohon untuk ditebang di wilayah tetua. Kelompok itu dianggap mengancam kelestarian hutan.","kom":"Pemahaman Inferensial"},{"n":28,"g":7,"type":"pg","question":"Apa yang akan dilakukan tokoh utama setelah mengalami peristiwa tersebut?","opts":["Meninggalkan pekerjaannya dan bergabung dengan tetua untuk melindungi hutan","Menyelesaikan proyek sesuai rencana agar kontrak kerja tidak batal","Meninggalkan hutan tanpa memberi tahu tetua untuk menghindari konflik","Menyampaikan laporan kepada perusahaan untuk mempercepat pengerahan alat berat","Mencari orang pintar untuk mengusir Roh Meratus yang berada di hutan tersebut"],"key":"A","alt":null,"exp":"Tokoh utama menyadari keindahan hutan dan bagaimana alat berat akan merusaknya. Ia meminta izin tinggal dan menjaga tempat itu bersama tetua, artinya ia meninggalkan pekerjaannya dan berpihak pada hutan.","kom":"Pemahaman Inferensial"},{"n":29,"g":7,"type":"bs","intro":["Perubahan sikap tokoh utama ditunjukkan melalui tindakannya di akhir kutipan.","Manakah pernyataan yang paling tepat untuk menilai kesesuaian antara karakter tokoh dan tindakannya?","Klik Benar atau Salah pada setiap pernyataan berikut!"],"rows":["Tindakan tokoh utama sesuai karena ia menunjukkan kepedulian terhadap kelestarian hutan setelah mengalami perubahan pandangan","Tindakan tokoh utama tidak sesuai karena ia telah meninggalkan kewajiban dalam menyelesaikan kontrak kerja","Tindakan tokoh utama sesuai karena ia ingin membuktikan bahwa ia mampu memimpin proyek tanpa menggunakan alat berat"],"key":["B","S","S"],"alt":null,"exp":"Pernyataan 1 Benar: tindakannya sesuai dengan kepeduliannya pada hutan setelah pandangannya berubah. Pernyataan 2 Salah: tindakannya justru sesuai dengan perubahan sikapnya. Pernyataan 3 Salah: tidak ada indikasi ia ingin membuktikan kemampuan memimpin proyek.","kom":"Evaluasi dan Apresiasi"},{"n":30,"g":8,"type":"pg","question":"Apa makna kata *sesepuh* pada teks tersebut?","opts":["keluarga yang dihormati oleh seluruh warga desa","orang yang dituakan atau dijadikan pemimpin","masyarakat yang memiliki peran penting","pengurus atau perangkat desa yang sudah tua","laki-laki yang sudah menikah dan memiliki anak"],"key":"B","alt":null,"exp":"*Sesepuh* berarti orang yang dituakan atau dijadikan pemimpin, sesuai konteks “para sesepuh desa atau orang-orang tua”.","kom":"Pemahaman Tekstual"},{"n":31,"g":8,"type":"pg","question":"Tradisi belis memiliki banyak nilai positif. Manakah gagasan penjelas yang mendukung gagasan pokok tersebut?","opts":["Jumlah belis ditentukan secara sepihak oleh keluarga perempuan.","Belis merupakan simbol keseriusan dan ketulusan dari pihak perempuan.","Balasan dari keluarga perempuan biasanya permintaan dari pihak laki-laki.","Belis menjadi wahana penghormatan dan juga penyatuan kedua pihak keluarga.","Belis harus berupa gading gajah dan tidak bisa diganti dengan benda lain."],"key":"D","alt":null,"exp":"Gagasan pokoknya: belis memiliki nilai positif. Gagasan penjelas yang mendukung adalah belis menjadi wahana penghormatan dan penyatuan kedua keluarga, sesuai paragraf kedua.","kom":"Pemahaman Inferensial"},{"n":32,"g":8,"type":"pg","question":"Bagaimana hubungan makna antara paragraf kedua dan ketiga pada teks tersebut?","opts":["Paragraf kedua mempertentangkan mengenai pelestarian tradisi belis beserta contohnya di paragraf ketiga.","Paragraf kedua memberikan penjelasan alasan tradisi belis yang digambarkan perlu dipertahankan di paragraf ketiga.","Paragraf ketiga memberikan perbandingan penerapan tradisi belis di beberapa daerah yang dijelaskan di paragraf kedua.","Paragraf ketiga menjelaskan tata laksana tradisi belis berdasarkan filosofinya seperti yang diuraikan di paragraf kedua.","Paragraf ketiga memaparkan dampak negatif tradisi belis, meskipun maknanya baik seperti yang dijelaskan di paragraf kedua."],"key":"E","alt":null,"exp":"Paragraf kedua menjelaskan makna positif belis. Paragraf ketiga membahas dampak negatifnya, yaitu beban finansial dan konflik, meskipun maknanya baik.","kom":"Pemahaman Inferensial"},{"n":33,"g":8,"type":"pg","question":"“Dengan demikian, perlu untuk memikirkan ulang makna belis dan menetapkan cara ataupun perhitungan besaran belis yang lebih fleksibel.” Kalimat tersebut dapat menjadi kesimpulan yang sesuai teks argumentasi tersebut karena ....","opts":["menekankan pentingnya menjaga tradisi belis agar tidak hilang ditelan zaman","mengusulkan agar tradisi belis dihapuskan sepenuhnya demi kesejahteraan keluarga","menegaskan bahwa belis adalah pertukaran materi semata dan tidak memiliki makna lain","merangkum masalah utama yang ditimbulkan oleh belis yang kaku, yaitu konflik dan tekanan","menyimpulkan solusi konkret untuk masalah yang dibahas, yaitu beban finansial akibat belis"],"key":"E","alt":null,"exp":"Kalimat itu adalah saran berupa memikirkan ulang makna dan menetapkan perhitungan yang lebih fleksibel. Jadi kalimat tersebut menyimpulkan solusi bagi masalah beban finansial akibat belis.","kom":"Evaluasi dan Apresiasi"}]};const Q=D.qs,MIN=90,L="ABCDE";let ans={},dbt={},cur=0,info={},endT,iv;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const f=s=>esc(s).replace(/\*(.+?)\*/g,"<em>$1</em>");
$("iq").textContent=Q.length;
$("go").onclick=()=>{const v=k=>$(k).value.trim();info={nm:v("nm"),kl:v("kl"),ps:v("ps"),sk:v("sk")};
 if(Object.values(info).some(x=>!x)){alert("Lengkapi semua identitas terlebih dahulu.");return}
 $("start").classList.add("hide");$("quiz").classList.remove("hide");
 $("wn").textContent=info.nm;$("wi").textContent=`${info.kl} • ${info.sk} • No. ${info.ps}`;
 endT=Date.now()+MIN*60000;tick();iv=setInterval(tick,1000);draw();scrollTo(0,0)};
function tick(){let s=Math.max(0,Math.round((endT-Date.now())/1000));$("tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");$("tm").classList.toggle("low",s<300);if(!s){clearInterval(iv);finish()}}
function pass(g){const G=D.groups[g];return `<div class="pass"><h3>${f(G.head)}</h3>${G.paras.map(p=>p.s?`<p class="s">${f(p.s)}</p>`:`<p>${f(p)}</p>`).join("")}</div>`}
function body(q,rev){
 if(q.type==="bs")return `<div class="qt">${q.intro.map(f).join("<br>")}</div><table><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>${q.rows.map((r,i)=>{const a=(ans[q.n]||[])[i];return `<tr><td>${f(r)}</td>${["B","S"].map(v=>`<td class="c"><input type="radio" name="r${i}" ${a===v?"checked":""} ${rev?"disabled":""} onchange="setBS(${i},'${v}')"></td>`).join("")}</tr>`}).join("")}</table>`;
 return `<div class="qt">${f(q.question)}</div>`+q.opts.map((o,i)=>`<div class="opt ${ans[q.n]===L[i]?"sel":""}" onclick="pick('${L[i]}')"><i>${L[i]}</i><span>${f(o)}</span></div>`).join("")}
function draw(){const q=Q[cur],G=D.groups[q.g];
 $("qc").innerHTML=`<span class="badge">Soal ${q.n} dari ${Q.length}</span> <span class="badge" style="background:#ffe6f6;color:#b4237f">${esc(q.kom)}</span><div style="font-size:12px;color:var(--mu);margin-bottom:8px">Teks “${esc(G.title)}” untuk soal ${G.start} s.d. ${G.end}</div>${pass(q.g)}${body(q)}
 <div class="nav"><button class="btn gh" ${cur?"":"disabled"} onclick="go(-1)">← Sebelumnya</button><button class="btn dbt ${dbt[q.n]?"on":""}" onclick="toggleD()">${dbt[q.n]?"✓ Ragu-ragu":"Ragu-ragu"}</button>${cur<Q.length-1?`<button class="btn" onclick="go(1)">Selanjutnya →</button>`:`<button class="btn fin" onclick="confirmFin()">Selesai ✓</button>`}</div>`;
 $("nums").innerHTML=Q.map((x,i)=>`<button class="n ${dbt[x.n]?"d":ans[x.n]?"a":""} ${i===cur?"cur":""}" onclick="cur=${i};draw();scrollTo(0,0)">${x.n}</button>`).join("")}
function ok(q){const a=ans[q.n];return q.type==="bs"?(a&&q.key.every((k,i)=>a[i]===k)):(a===q.key||(q.alt&&q.alt.includes(a)))}
window.pick=l=>{ans[Q[cur].n]=l;draw()};window.setBS=(i,v)=>{const n=Q[cur].n;ans[n]=ans[n]||[];ans[n][i]=v;draw()};
window.toggleD=()=>{const n=Q[cur].n;dbt[n]=!dbt[n];draw()};window.go=d=>{cur+=d;draw();scrollTo(0,0)};
const done=q=>q.type==="bs"?(ans[q.n]||[]).filter(Boolean).length===q.rows.length:!!ans[q.n];
window.confirmFin=()=>{const a=Q.filter(done).length,d=Object.values(dbt).filter(Boolean).length;
 $("md").innerHTML=`<div class="modal"><div class="card"><h2>Kumpulkan jawaban?</h2><p>Dijawab: <b>${a}</b> • Belum dijawab: <b>${Q.length-a}</b> • Ragu-ragu: <b>${d}</b></p><p style="color:var(--mu);font-size:13px">Setelah dikumpulkan, jawaban tidak dapat diubah.</p><div class="nav"><button class="btn gh" onclick="$('md').innerHTML=''">Kembali</button><button class="btn fin" onclick="finish()">Ya, Kumpulkan</button></div></div></div>`};
$("fin").onclick=confirmFin;
function finish(){clearInterval(iv);$("md").innerHTML="";$("quiz").classList.add("hide");$("result").classList.remove("hide");
 const b=Q.filter(ok).length,k=Q.filter(q=>!done(q)).length,s=Math.round(b/Q.length*1000)/10;
 $("sc").textContent=s;$("ring").style.setProperty("--v",s);
 $("id").innerHTML=[["Nama Siswa",info.nm],["Kelas",info.kl],["Peserta Didik",info.ps],["Asal Sekolah",info.sk]].map(([a,v])=>`<div>${a}<b>${esc(v)}</b></div>`).join("");
 $("st").innerHTML=`<span style="background:var(--ok)">Benar ${b}</span><span style="background:var(--bad)">Salah ${Q.length-b-k}</span><span style="background:#8a88a8">Kosong ${k}</span>`;
 let h="",lg=-1;Q.forEach(q=>{const G=D.groups[q.g];
  if(q.g!==lg){lg=q.g;h+=`<div class="gt">Teks “${esc(G.title)}” (soal ${G.start}–${G.end})</div><details><summary>Lihat teks bacaan</summary>${pass(q.g)}</details>`}
  const r=ok(q);let c;
  if(q.type==="bs")c=`<div class="qt">${q.intro.map(f).join("<br>")}</div><table><tr><th>Pernyataan</th><th>Jawabanmu</th><th>Kunci</th></tr>${q.rows.map((x,i)=>{const a=(ans[q.n]||[])[i],t={B:"Benar",S:"Salah"};return `<tr><td>${f(x)}</td><td class="c" style="width:90px;color:${a===q.key[i]?"var(--ok)":"var(--bad)"}">${t[a]||"—"}</td><td class="c" style="width:90px">${t[q.key[i]]}</td></tr>`}).join("")}</table>`;
  else c=`<div class="qt">${f(q.question)}</div>`+q.opts.map((o,i)=>{const K=L[i]===q.key||(q.alt&&q.alt.includes(L[i]));return `<div class="opt ${K?"k":ans[q.n]===L[i]?"w":""}"><i>${L[i]}</i><span>${f(o)}${ans[q.n]===L[i]?" <b>(jawabanmu)</b>":""}${K?" ✓":""}</span></div>`}).join("");
  h+=`<div class="card rv ${r?"ok":"x"}"><span class="badge">Soal ${q.n} • ${r?"Benar":done(q)?"Salah":"Tidak dijawab"}</span>${c}<div class="exp"><b>Pembahasan:</b> Kunci <b>${q.type==="bs"?q.key.map(v=>v==="B"?"Benar":"Salah").join(" – "):q.key}</b>${q.alt?" (atau D)":""}. ${f(q.exp)}</div></div>`});
 $("rv").innerHTML=h;scrollTo(0,0)}
</script></body></html>
